<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skill Swap Hub — Join</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --surface2: #1a1a24;
      --border: rgba(255,255,255,0.07);
      --accent: #6c63ff;
      --accent2: #ff6584;
      --text: #f0f0f5;
      --muted: #6b6b80;
      --success: #4ade80;
      --error: #f87171;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse 60% 50% at 20% 20%, rgba(108,99,255,0.15) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 80% 80%, rgba(255,101,132,0.1) 0%, transparent 60%),
        radial-gradient(ellipse 40% 60% at 60% 10%, rgba(108,99,255,0.08) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
    }

    /* Logo */
    .logo {
      text-align: center;
      margin-bottom: 32px;
      animation: fadeDown 0.5s ease both;
    }

    .logo-icon {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .logo-badge {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .logo-text {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .logo-text span {
      color: var(--accent);
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px;
      animation: fadeUp 0.5s ease both 0.1s;
      box-shadow: 0 40px 80px rgba(0,0,0,0.4);
    }

    /* Tab Toggle */
    .tabs {
      display: flex;
      background: var(--surface2);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 28px;
      position: relative;
    }

    .tab-slider {
      position: absolute;
      top: 4px;
      left: 4px;
      width: calc(50% - 4px);
      height: calc(100% - 8px);
      background: var(--accent);
      border-radius: 7px;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 2px 12px rgba(108,99,255,0.4);
    }

    .tab-slider.signup { transform: translateX(100%); }

    .tab-btn {
      flex: 1;
      position: relative;
      z-index: 1;
      background: none;
      border: none;
      color: var(--muted);
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 700;
      padding: 10px;
      cursor: pointer;
      border-radius: 7px;
      transition: color 0.3s;
      letter-spacing: 0.3px;
    }

    .tab-btn.active { color: white; }

    /* Form Header */
    .form-header {
      margin-bottom: 24px;
    }

    .form-title {
      font-family: 'Syne', sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .form-subtitle {
      color: var(--muted);
      font-size: 14px;
      font-weight: 300;
    }

    /* Alert Messages */
    .alert {
      display: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 20px;
      font-weight: 500;
      align-items: center;
      gap: 8px;
      animation: fadeUp 0.3s ease;
    }

    .alert.show { display: flex; }

    .alert-error {
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.2);
      color: var(--error);
    }

    .alert-success {
      background: rgba(74,222,128,0.1);
      border: 1px solid rgba(74,222,128,0.2);
      color: var(--success);
    }

    /* Form Fields */
    .fields { display: flex; flex-direction: column; gap: 16px; }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field.hidden { display: none; }

    label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
    }

    input, textarea {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 16px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      width: 100%;
    }

    input::placeholder, textarea::placeholder { color: var(--muted); }

    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(108,99,255,0.15);
    }

    textarea {
      resize: none;
      height: 72px;
      line-height: 1.5;
    }

    .hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: -4px;
    }

    .password-hint {
      font-size: 11px;
      color: var(--error);
      display: none;
      margin-top: -4px;
    }

    /* Submit Button */
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 4px;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 20px rgba(108,99,255,0.3);
    }

    .btn-primary:hover {
      background: #7c74ff;
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(108,99,255,0.4);
    }

    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .divider-text {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      white-space: nowrap;
    }

    /* Google Button */
    .btn-google {
      width: 100%;
      padding: 13px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
    }

    .btn-google:hover {
      background: var(--surface);
      border-color: rgba(255,255,255,0.15);
      transform: translateY(-1px);
    }

    .btn-google svg { width: 18px; height: 18px; flex-shrink: 0; }

    /* Loading spinner */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="wrapper">

  <!-- Logo -->
  <div class="logo">
    <div class="logo-icon">
      <div class="logo-badge">⚡</div>
      <div class="logo-text">Skill<span>Swap</span> Hub</div>
    </div>
  </div>

  <!-- Card -->
  <div class="card">

    <!-- Tabs -->
    <div class="tabs">
      <div class="tab-slider" id="tabSlider"></div>
      <button class="tab-btn active" id="loginTab" onclick="switchTab('login')">Login</button>
      <button class="tab-btn" id="signupTab" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <!-- Form Header -->
    <div class="form-header">
      <div class="form-title" id="formTitle">Welcome back</div>
      <div class="form-subtitle" id="formSubtitle">Sign in to continue trading skills</div>
    </div>

    <!-- Alerts -->
    <div class="alert alert-error" id="errorAlert">
      <span>⚠</span>
      <span id="errorText"></span>
    </div>
    <div class="alert alert-success" id="successAlert">
      <span>✓</span>
      <span id="successText"></span>
    </div>

    <!-- Form -->
    <form id="authForm" onsubmit="handleSubmit(event)">
      <div class="fields">

        <!-- Full Name (signup only) -->
        <div class="field hidden" id="fieldName">
          <label>Full Name</label>
          <input type="text" id="fullName" placeholder="Raiyan Chougle" />
        </div>

        <!-- Email -->
        <div class="field">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>

        <!-- Password -->
        <div class="field">
          <label>Password</label>
          <input type="password" id="password" placeholder="••••••••" required oninput="checkPassword()" />
          <div class="password-hint" id="passwordHint">Password must be at least 6 characters</div>
        </div>

        <!-- Confirm Password (signup only) -->
        <div class="field hidden" id="fieldConfirm">
          <label>Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="••••••••" oninput="checkPassword()" />
        </div>

        <!-- Skills to Teach (signup only) -->
        <div class="field hidden" id="fieldTeach">
          <label>Skills I Can Teach</label>
          <textarea id="teachSkills" placeholder="e.g. Python, Guitar, Photography"></textarea>
          <div class="hint">Separate with commas</div>
        </div>

        <!-- Skills to Learn (signup only) -->
        <div class="field hidden" id="fieldLearn">
          <label>Skills I Want to Learn</label>
          <textarea id="learnSkills" placeholder="e.g. React, Drawing, Spanish"></textarea>
          <div class="hint">Separate with commas</div>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">Sign In</button>

      </div>
    </form>

    <!-- Divider -->
    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-text">or continue with</div>
      <div class="divider-line"></div>
    </div>

    <!-- Google Button -->
    <button class="btn-google" onclick="handleGoogle()">
      <svg viewBox="0 0 24 24">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

  </div>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, updateProfile } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

  // Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyA6aCr1L8MaEE9aeQ-nNGEzxdjiGVPUMCU",
    authDomain: "skillswap-d2626.firebaseapp.com",
    projectId: "skillswap-d2626",
    storageBucket: "skillswap-d2626.firebasestorage.app",
    messagingSenderId: "34762810999",
    appId: "1:34762810999:web:cae33caad1337b0eebc872",
    measurementId: "G-0BHE3F5JZ7"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const googleProvider = new GoogleAuthProvider();

  // Helper: Show error
  function showError(msg) {
    const el = document.getElementById('errorAlert');
    document.getElementById('errorText').textContent = msg;
    el.classList.add('show');
    document.getElementById('successAlert').classList.remove('show');
  }

  // Helper: Show success
  function showSuccess(msg) {
    const el = document.getElementById('successAlert');
    document.getElementById('successText').textContent = msg;
    el.classList.add('show');
    document.getElementById('errorAlert').classList.remove('show');
  }

  // Helper: Hide alerts
  function hideAlerts() {
    document.getElementById('errorAlert').classList.remove('show');
    document.getElementById('successAlert').classList.remove('show');
  }

  // Helper: Save user profile to Firestore
  async function saveProfile(user, extraData = {}) {
    const userRef = doc(db, 'users', user.uid);
    const existing = await getDoc(userRef);

    // Only create profile if it doesn't exist yet
    if (!existing.exists()) {
      await setDoc(userRef, {
        uid: user.uid,
        fullName: extraData.fullName || user.displayName || '',
        email: user.email,
        skillsToTeach: extraData.skillsToTeach || [],
        skillsToLearn: extraData.skillsToLearn || [],
        creditBalance: 0,
        verifiedSkills: [],
        photoURL: user.photoURL || '',
        createdAt: serverTimestamp()
      });
    }
  }

  // Helper: Redirect after login
  function redirectAfterLogin() {
    window.location.href = 'dashboard.html';
  }

  // Handle Email/Password form submit
  window.handleSubmit = async function(e) {
    e.preventDefault();
    hideAlerts();

    const isLogin = document.getElementById('loginTab').classList.contains('active');
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('submitBtn');

    // Loading state
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>' + (isLogin ? 'Signing in...' : 'Creating account...');

    try {
      if (isLogin) {
        // LOGIN
        const { user } = await signInWithEmailAndPassword(auth, email, password);
        showSuccess('Welcome back! Redirecting...');
        setTimeout(redirectAfterLogin, 1200);

      } else {
        // SIGN UP - validate first
        const fullName = document.getElementById('fullName').value.trim();
        const confirmPwd = document.getElementById('confirmPassword').value;
        const teachRaw = document.getElementById('teachSkills').value;
        const learnRaw = document.getElementById('learnSkills').value;

        const skillsToTeach = teachRaw.split(',').map(s => s.trim()).filter(Boolean);
        const skillsToLearn = learnRaw.split(',').map(s => s.trim()).filter(Boolean);

        if (!fullName) throw new Error('Please enter your full name');
        if (password !== confirmPwd) throw new Error('Passwords do not match');
        if (password.length < 6) throw new Error('Password must be at least 6 characters');
        if (skillsToTeach.length === 0) throw new Error('Please enter at least one skill you can teach');
        if (skillsToLearn.length === 0) throw new Error('Please enter at least one skill you want to learn');

        // Create user
        const { user } = await createUserWithEmailAndPassword(auth, email, password);

        // Update display name
        await updateProfile(user, { displayName: fullName });

        // Save profile to Firestore
        await saveProfile(user, { fullName, skillsToTeach, skillsToLearn });

        showSuccess('Account created! Taking you to your dashboard...');
        setTimeout(redirectAfterLogin, 1500);
      }

    } catch (err) {
      console.error(err);
      // Make Firebase errors more readable
      const messages = {
        'auth/user-not-found': 'No account found with this email',
        'auth/wrong-password': 'Incorrect password',
        'auth/email-already-in-use': 'An account with this email already exists',
        'auth/invalid-email': 'Please enter a valid email address',
        'auth/weak-password': 'Password must be at least 6 characters',
        'auth/too-many-requests': 'Too many attempts. Please wait a moment and try again',
        'auth/invalid-credential': 'Incorrect email or password'
      };
      showError(messages[err.code] || err.message);
      btn.disabled = false;
      btn.innerHTML = isLogin ? 'Sign In' : 'Create Account';
    }
  };

  // Handle Google Sign In
  window.handleGoogle = async function() {
    hideAlerts();
    try {
      const { user } = await signInWithPopup(auth, googleProvider);
      await saveProfile(user);
      showSuccess('Signed in with Google! Redirecting...');
      setTimeout(redirectAfterLogin, 1200);
    } catch (err) {
      console.error(err);
      if (err.code !== 'auth/popup-closed-by-user') {
        showError('Google sign-in failed. Please try again.');
      }
    }
  };
</script>

<!-- UI Logic -->
<script>
  let currentTab = 'login';

  const signupFields = ['fieldName', 'fieldConfirm', 'fieldTeach', 'fieldLearn'];

  function switchTab(tab) {
    currentTab = tab;
    const isSignup = tab === 'signup';

    // Update slider
    const slider = document.getElementById('tabSlider');
    slider.className = 'tab-slider' + (isSignup ? ' signup' : '');

    // Update tab buttons
    document.getElementById('loginTab').classList.toggle('active', !isSignup);
    document.getElementById('signupTab').classList.toggle('active', isSignup);

    // Update header
    document.getElementById('formTitle').textContent = isSignup ? 'Create your account' : 'Welcome back';
    document.getElementById('formSubtitle').textContent = isSignup ? 'Join the skill-trading community' : 'Sign in to continue trading skills';

    // Update button
    document.getElementById('submitBtn').textContent = isSignup ? 'Create Account' : 'Sign In';

    // Toggle signup fields
    signupFields.forEach(id => {
      document.getElementById(id).classList.toggle('hidden', !isSignup);
    });

    // Hide alerts on switch
    document.getElementById('errorAlert').classList.remove('show');
    document.getElementById('successAlert').classList.remove('show');
  }

  function checkPassword() {
    const isSignup = currentTab === 'signup';
    if (!isSignup) return;

    const pwd = document.getElementById('password').value;
    const confirm = document.getElementById('confirmPassword').value;
    const hint = document.getElementById('passwordHint');
    const btn = document.getElementById('submitBtn');

    const validLength = pwd.length >= 6;
    const matches = pwd === confirm;

    hint.style.display = (!validLength && pwd.length > 0) ? 'block' : 'none';
    btn.disabled = !(validLength && matches && pwd.length > 0);
  }
</script>

</body>
</html>
