<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Connection Test v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-8">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">🔍 Supabase Connection Test v2</h1>
        
        <div class="space-y-4">
            <div class="bg-gray-800 p-4 rounded-lg">
                <h2 class="text-xl font-bold mb-2">Test Results:</h2>
                <div id="results" class="space-y-2 font-mono text-sm"></div>
            </div>
            
            <button 
                id="testBtn"
                class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-lg"
            >
                Run Tests
            </button>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const supabaseUrl = 'https://xnsxucxwajiieqvlxnon.supabase.co';
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhuc3h1Y3h3YWppaWVxdmx4bm9uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExNTYyMzksImV4cCI6MjA4NjczMjIzOX0.6wJ88lHECRtbqc6kHiglHrq9WkHAgGjmwjEr39CPL9w';
        
        const supabase = createClient(supabaseUrl, supabaseAnonKey);
        const resultsDiv = document.getElementById('results');
        
        function log(message, isError = false) {
            const p = document.createElement('p');
            p.className = isError ? 'text-red-400' : 'text-green-400';
            p.textContent = message;
            resultsDiv.appendChild(p);
        }
        
        async function runTests() {
            resultsDiv.innerHTML = '';
            log('Starting tests... (' + new Date().toLocaleTimeString() + ')');
            
            // Test 1: Check if Supabase client is created
            try {
                log('✓ Supabase client created successfully');
            } catch (error) {
                log('✗ Failed to create Supabase client: ' + error.message, true);
                return;
            }
            
            // Test 2: Check connection to Supabase
            try {
                const { data, error } = await supabase.auth.getSession();
                if (error) throw error;
                log('✓ Successfully connected to Supabase');
            } catch (error) {
                log('✗ Connection failed: ' + error.message, true);
                return;
            }
            
            // Test 3: Check if profiles table exists
            log('\n--- Checking Tables ---');
            try {
                const { data, error } = await supabase
                    .from('profiles')
                    .select('count')
                    .limit(0);
                
                if (error) {
                    log('✗ Profiles table error: ' + error.message, true);
                    log('  Error details: ' + JSON.stringify(error), true);
                } else {
                    log('✓ Profiles table exists and is accessible');
                }
            } catch (error) {
                log('✗ Table check failed: ' + error.message, true);
            }
            
            // Test 4: Check if sessions table exists
            try {
                const { data, error } = await supabase
                    .from('sessions')
                    .select('count')
                    .limit(0);
                
                if (error) {
                    log('✗ Sessions table error: ' + error.message, true);
                } else {
                    log('✓ Sessions table exists and is accessible');
                }
            } catch (error) {
                log('✗ Sessions table check failed: ' + error.message, true);
            }
            
            // Test 5: Try to sign up a test user
            log('\n--- Testing Authentication ---');
            const testEmail = 'test_' + Date.now() + '@example.com';
            const testPassword = 'testpass123';
            
            try {
                log('Attempting to create test user...');
                const { data: authData, error: signUpError } = await supabase.auth.signUp({
                    email: testEmail,
                    password: testPassword
                });
                
                if (signUpError) {
                    log('✗ Sign up failed: ' + signUpError.message, true);
                } else {
                    log('✓ Auth user created successfully');
                    log('  User ID: ' + authData.user.id);
                    
                    // Test 6: Try to create profile
                    log('\n--- Testing Profile Creation ---');
                    try {
                        const { data: profileData, error: profileError } = await supabase
                            .from('profiles')
                            .insert({
                                id: authData.user.id,
                                full_name: 'Test User',
                                email: testEmail,
                                skills_to_teach: ['Testing'],
                                skills_to_learn: ['Debugging'],
                                credit_balance: 0,
                                verified_skills: []
                            })
                            .select();
                        
                        if (profileError) {
                            log('✗ Profile creation failed: ' + profileError.message, true);
                            log('  Error details: ' + JSON.stringify(profileError), true);
                        } else {
                            log('✓ Profile created successfully!');
                            log('  🎉 EVERYTHING IS WORKING!');
                        }
                    } catch (error) {
                        log('✗ Profile creation error: ' + error.message, true);
                    }
                }
            } catch (error) {
                log('✗ Sign up test failed: ' + error.message, true);
            }
            
            log('\n--- Tests Complete ---');
        }
        
        document.getElementById('testBtn').addEventListener('click', runTests);
        
        // Auto-run tests on load
        runTests();
    </script>
</body>
</html>
